<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>NOVA CMS — 管理後台</title>
<link rel="icon" type="image/png" sizes="128x128" href="../img/favicon-128.png">
<link rel="apple-touch-icon" sizes="180x180" href="../img/favicon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* NOVA CMS 後台 — 沿用官網設計語言（深黑、hairline、暖橘 accent、方角） */
:root{
  --bg:#08070a; --panel:rgba(255,255,255,.02); --panel2:rgba(255,255,255,.04);
  --ink-0:#f2eee9; --ink-1:#a39a90; --ink-2:#655d55;
  --accent:#ff8a32; --accent-2:#ffb066;
  --line:rgba(236,224,210,.13); --line-soft:rgba(236,224,210,.07);
  --mono:'JetBrains Mono',ui-monospace,monospace;
  --disp:'Chakra Petch','Noto Sans TC',sans-serif;
  --tc:'Noto Sans TC',sans-serif;
  --ok:#7ddf9a; --danger:#f08a8a;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink-0);font-family:var(--tc);-webkit-font-smoothing:antialiased;font-size:14px}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit}

.mono{font-family:var(--mono)}
.kicker{font-family:var(--mono);font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent)}

/* 按鈕 */
.btn{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:transparent;color:var(--ink-1);font-size:12.5px;font-weight:700;padding:8px 14px;border-radius:0;transition:color .25s,border-color .25s,background .25s}
.btn:hover{color:var(--ink-0);border-color:rgba(236,224,210,.3)}
.btn:disabled{opacity:.4;cursor:default}
.btn-brand{border-color:rgba(255,176,102,.7);background:linear-gradient(180deg,rgba(255,138,50,.9),rgba(240,126,40,.9));color:#160a02}
.btn-brand:hover{color:#160a02;filter:brightness(1.08)}
.btn-danger{color:var(--danger);border-color:rgba(240,138,138,.35)}
.btn-danger:hover{color:#ffb3b3}
.btn-sm{padding:5px 9px;font-size:11.5px}

/* 表單元素 */
.field label{display:block;margin-bottom:6px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;color:var(--ink-1)}
.in{width:100%;border:1px solid var(--line);background:rgba(255,255,255,.035);color:var(--ink-0);font-size:13.5px;padding:9px 11px;outline:none;border-radius:0;transition:border-color .25s}
.in:focus{border-color:var(--accent)}
textarea.in{resize:vertical;line-height:1.6}
select.in{appearance:none;-webkit-appearance:none;font-weight:700}

/* 版面 */
.login-wrap{min-height:100svh;display:grid;place-items:center;padding:24px}
.login-card{width:100%;max-width:380px;border:1px solid var(--line-soft);background:var(--panel);padding:34px}
.login-card h1{font-family:var(--disp);font-size:21px;margin-top:10px}

.shell{display:flex;min-height:100svh}
.side{width:230px;flex:none;border-right:1px solid var(--line-soft);padding:22px 18px;display:flex;flex-direction:column;position:sticky;top:0;height:100svh}
.side nav{margin-top:26px}
.side .grp{margin:18px 0 6px;font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--ink-2)}
.side .navbtn{display:block;width:100%;text-align:left;border:0;background:none;color:var(--ink-1);font-size:13.5px;font-weight:700;padding:8px 10px}
.side .navbtn.on{background:rgba(255,138,50,.1);color:var(--accent)}
.side .me{margin-top:auto;border-top:1px solid var(--line-soft);padding-top:14px}
.main{min-width:0;flex:1;padding:26px 30px 60px}
.tophead{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:20px;flex-wrap:wrap}
.tophead h2{font-family:var(--disp);font-size:18px}
.topmsg{font-size:12px;color:var(--accent);max-width:420px;text-align:right}

/* 區塊卡 */
.card{border:1px solid var(--line-soft);background:var(--panel);transition:border-color .3s}
.card.open{border-color:rgba(255,138,50,.45)}
.card+.card{margin-top:10px}
.card-head{display:flex;align-items:center;gap:12px;padding:13px 16px}
.card.open .card-head{background:rgba(255,138,50,.05)}
.card-head .tt{display:flex;min-width:0;flex:1;align-items:center;gap:10px;text-align:left;border:0;background:none;color:var(--ink-0);font-size:14px;font-weight:700}
.card-head .tt .arr{color:var(--ink-2);transition:transform .25s}
.card.open .tt .arr{transform:rotate(90deg);color:var(--accent)}
.card.open .tt{color:var(--accent)}
.card-head .key{font-family:var(--mono);font-size:10.5px;color:var(--ink-2)}
.card-body{border-top:1px solid var(--line-soft);padding:18px 16px;display:grid;gap:14px}
.sw{display:inline-flex;align-items:center;gap:8px;border:0;background:none;font-size:11.5px;font-weight:700}
.sw .trk{position:relative;width:30px;height:16px;border:1px solid var(--line);transition:.25s}
.sw .dot{position:absolute;top:50%;transform:translateY(-50%);width:10px;height:10px;left:2px;background:var(--ink-2);transition:.25s}
.sw.on{color:var(--accent)}
.sw.on .trk{border-color:rgba(255,138,50,.6);background:rgba(255,138,50,.14)}
.sw.on .dot{left:calc(100% - 12px);background:var(--accent)}
.sw:disabled{opacity:.35}

/* 清單欄位 */
.listbox{border:1px solid var(--line-soft);background:var(--panel2)}
.listbox .li{border-bottom:1px dashed var(--line-soft)}
.listbox .li:last-child{border-bottom:0}
.li-head{display:flex;align-items:center;gap:10px;padding:9px 12px}
.li-head .sum{display:flex;min-width:0;flex:1;align-items:center;gap:8px;border:0;background:none;color:var(--ink-0);font-size:13px;font-weight:700;text-align:left}
.li-head .idx{font-family:var(--mono);font-size:10px;color:var(--ink-2)}
.li-body{border-top:1px solid var(--line-soft);padding:12px;display:grid;gap:10px}
.group-title{display:flex;align-items:center;gap:9px;font-size:13px;font-weight:700;color:var(--ink-0)}
.group-title::before{content:"";width:8px;height:8px;background:var(--accent)}
.group-title .cnt{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);font-weight:400}

/* 圖片欄位 */
.imgrow{display:flex;gap:10px;align-items:flex-start}
.imgrow img{width:56px;height:56px;object-fit:cover;border:1px solid var(--line);flex:none}
.imgrow .grow{flex:1;min-width:0;display:grid;gap:7px}

/* 表格（名單） */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.1em;color:var(--ink-2);text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 8px;border-bottom:1px solid var(--line-soft);color:var(--ink-1);vertical-align:top}
td.b{color:var(--ink-0);font-weight:700;white-space:nowrap}

.note{font-size:12.5px;line-height:1.7;color:var(--ink-2)}
.okmsg{font-size:12px;color:var(--accent)}
.panel{border:1px solid var(--line-soft);background:var(--panel);padding:20px}
.panel h3{font-family:var(--disp);font-size:15px;margin-bottom:8px}
.pw-box{border:1px solid rgba(255,138,50,.4);background:rgba(255,138,50,.06);padding:14px;margin-top:12px}
.pw-box .pw{font-family:var(--mono);font-size:15px;font-weight:700;color:var(--accent);user-select:all}

.modal{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(0,0,0,.72);padding:24px}
.modal>div{width:100%;max-width:400px;border:1px solid var(--line);background:#0d0b09;padding:26px}

@media(max-width:860px){.shell{flex-direction:column}.side{width:100%;height:auto;position:static;flex-direction:row;align-items:center;flex-wrap:wrap;gap:8px}.side nav{margin:0;display:flex;gap:2px;flex-wrap:wrap}.side .grp{display:none}.side .me{margin:0;border:0;padding:0;margin-left:auto}.main{padding:18px 16px 60px}}
</style>
</head>
<body>
<div id="app"><div class="login-wrap"><p class="mono" style="color:var(--ink-2)">載入中…</p></div></div>
<script type="module" src="./app.js"></script>
</body>
</html>
